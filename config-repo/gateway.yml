server.port: 8443

server.ssl:
  key-store-type: PKCS12
  key-store: classpath:keystore/edge.p12
  key-store-password: testtest
  key-alias: localhost

spring.application.name: gateway


spring.security.oauth2.resourceserver.jwt.issuer-uri: http://${app.auth-server}

spring.cloud.gateway.server.webflux.trusted-proxies: .*
spring.cloud.gateway.server.webflux.routes:      # 🔧 교재: spring.cloud.gateway.routes

- id: product-composite
  uri: http://product-composite
  predicates:
  - Path=/product-composite/**

- id: product-composite-swagger-ui
  uri: http://product-composite
  predicates:
  - Path=/openapi/**

- id: oauth2-server
  uri: http://${app.auth-server}
  predicates:
  - Path=/oauth2/**

- id: oauth2-login
  uri: http://${app.auth-server}
  predicates:
  - Path=/login/**

- id: oauth2-error
  uri: http://${app.auth-server}
  predicates:
  - Path=/error/**

- id: host_route_200
  uri: https://httpbin.org
  predicates:
  - Host=i.feel.lucky:8443
  - Path=/headerrouting/**
  filters:
  - SetPath=/status/200

- id: host_route_418
  uri: https://httpbin.org
  predicates:
  - Host=im.a.teapot:8443
  - Path=/headerrouting/**
  filters:
  - SetPath=/status/418

- id: host_route_501
  uri: https://httpbin.org
  predicates:
  - Path=/headerrouting/**
  filters:
  - SetPath=/status/501

management.endpoint.gateway.access: unrestricted
management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: INFO
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: TRACE

---
spring.config.activate.on-profile: prod

logging:
  level:
    root: WARN
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: WARN
    org.springframework.cloud.gateway: WARN
    org.springframework.web.server.adapter.HttpWebHandlerAdapter: WARN