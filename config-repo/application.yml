app:
  auth-server: localhost

spring.rabbitmq:
  host: 127.0.0.1
  port: 5672

spring.cloud.stream.kafka.binder:
  brokers: 127.0.0.1
  defaultBrokerPort: 9092

spring.web.error.include-message: always          # 🔧 Boot 4 이름 (교재: server.error.include-message)

management.server.port: 4004
management.endpoint.health.show-details: "ALWAYS"
management.endpoints.web.exposure.include: "*"
management.endpoint.health.probes.enabled: true
management.health.rabbit.enabled: true
management.health.kafka.enabled: false

management.tracing.sampling.probability: 1.0
management.tracing.export.zipkin.endpoint: http://jaeger-collector.istio-system:9411/api/v2/spans

server.shutdown: graceful
spring.lifecycle.timeout-per-shutdown-phase: 10s

logging.pattern.correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
logging.include-application-name: false

---
spring.config.activate.on-profile: docker

spring.rabbitmq.host: rabbitmq
spring.cloud.stream.kafka.binder.brokers: kafka

app:
  auth-server: auth-server

---
spring.config.activate.on-profile: kafka

management.health.rabbit.enabled: false
management.health.kafka.enabled: true

---
spring.config.activate.on-profile: prod
spring.rabbitmq.host: 172.17.0.1

# 운영(prod)에서는 health, info, circuitbreakerevents 만 노출
management.endpoints.web.exposure.include: health,info,circuitbreakerevents